apiVersion: apps/v1
kind: Deployment
metadata: { name: rust-api, namespace: munk8s }
spec:
  replicas: 1
  selector: { matchLabels: { app: rust-api } }
  template:
    metadata: { labels: { app: rust-api } }
    spec:
      containers:
        - name: rust-api
          image: zot.local:5000/munk8s/rust-api:v2
          ports: [{ containerPort: 8080 }]
          env:
            - { name: GO_URL, value: "http://go-deployment1:8081/report" }
            - { name: DAPR_URL, value: "http://dapr-publisher:8090/publish" }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: rust-api, namespace: munk8s }
spec:
  selector: { app: rust-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rust-api, namespace: munk8s }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rust-api }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 30 }
