apiVersion: apps/v1
kind: Deployment
metadata: { name: go-deployment1, namespace: munk8s }
spec:
  replicas: 1
  selector: { matchLabels: { app: go-deployment1 } }
  template:
    metadata: { labels: { app: go-deployment1 } }
    spec:
      containers:
        - name: api
          image: zot.local:5000/munk8s/go-api:v1
          ports: [{ containerPort: 8081 }]
          env:
            - { name: GRPC_CLIENT_URL, value: "http://localhost:8082/send" }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 8081 }, periodSeconds: 5 }
        - name: grpc-client
          image: zot.local:5000/munk8s/go-grpc-client:v2
          env:
            - { name: GRPC_SERVER_ADDR, value: "go-grpc-server:50051" }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: go-deployment1, namespace: munk8s }
spec:
  selector: { app: go-deployment1 }
  ports: [{ port: 8081, targetPort: 8081 }]
