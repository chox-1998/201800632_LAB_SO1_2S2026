apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasources
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey
        uid: valkey
        type: redis-datasource
        access: proxy
        isDefault: true
        editable: true
        url: redis://{{ .Values.valkey.address }}
        jsonData:
          client: standalone
          poolSize: 10
          timeout: 10
          pingInterval: 0
          pipelineWindow: 0
